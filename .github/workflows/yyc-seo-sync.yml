name: YYC Public SEO Sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'scripts/generate-public-pages.mjs'
      - '.github/workflows/yyc-seo-sync.yml'
      - 'video-sitemap.xml'
      - 'robots.txt'
      - 'reels/**'
      - 'swags/**'
      - 'events/**'
      - 'updates/**'
      - 'gallery/**'
      - 'leaders/**'
      - 'achievements/**'
      - 'media.html'
      - 'instagram.html'
      - 'leaders.html'
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: yyc-public-seo-sync
  cancel-in-progress: false

jobs:
  generate:
    # Skip only the push event caused by this workflow's own commit.
    if: github.actor != 'github-actions[bot]' || github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Validate generator syntax
        run: node --check scripts/generate-public-pages.mjs

      - name: Ensure FFmpeg is available for automatic Reel thumbnails
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Generate crawlable public pages and sitemap
        run: node scripts/generate-public-pages.mjs

      - name: Validate sitemap
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const xml = fs.readFileSync('sitemap.xml', 'utf8');
          const urls = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
          if (!xml.startsWith('<?xml')) throw new Error('Sitemap XML declaration is missing');
          if (!urls.length) throw new Error('Sitemap contains no URLs');
          if (new Set(urls).size !== urls.length) throw new Error('Sitemap contains duplicate URLs');
          for (const required of [
            'https://www.yuvakesariyouthclub.in/',
            'https://www.yuvakesariyouthclub.in/media.html',
            'https://www.yuvakesariyouthclub.in/instagram.html',
            'https://www.yuvakesariyouthclub.in/leaders.html',
            'https://www.yuvakesariyouthclub.in/events/',
            'https://www.yuvakesariyouthclub.in/gallery/',
            'https://www.yuvakesariyouthclub.in/reels/',
            'https://www.yuvakesariyouthclub.in/swags/'
          ]) {
            if (!urls.includes(required)) throw new Error('Required URL missing from sitemap: ' + required);
          }
          const videoXml = fs.readFileSync('video-sitemap.xml', 'utf8');
          if (!videoXml.startsWith('<?xml')) throw new Error('Video sitemap XML declaration is missing');
          if (!videoXml.includes('xmlns:video="http://www.google.com/schemas/sitemap-video/1.1"')) throw new Error('Video sitemap namespace is missing');
          const videoUrls = [...videoXml.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
          const videoBlocks = [...videoXml.matchAll(/<video:video>([\s\S]*?)<\/video:video>/g)].map(m => m[1]);
          if (videoUrls.length !== videoBlocks.length) throw new Error('Each video sitemap URL must contain exactly one video entry');
          if (new Set(videoUrls).size !== videoUrls.length) throw new Error('Video sitemap contains duplicate URLs');
          const reelsHtml = fs.readFileSync('reels/index.html', 'utf8');
          const reelPageFiles = [...new Set([...reelsHtml.matchAll(/href="\\.\\/auto\\/([^\"]+\\.html)"/g)].map(m => m[1]))];
          if (videoUrls.length !== reelPageFiles.length) throw new Error('Every published Reel watch page must have one video sitemap entry with an automatic thumbnail. Watch pages: ' + reelPageFiles.length + '; video sitemap entries: ' + videoUrls.length);
          for (let i = 0; i < videoUrls.length; i++) {
            const url = videoUrls[i];
            if (!urls.includes(url)) throw new Error('Video watch page missing from main sitemap: ' + url);
            const pathname = new URL(url).pathname.replace(/^\/+/, '');
            if (!fs.existsSync(pathname)) throw new Error('Video watch page file missing: ' + pathname);
            const html = fs.readFileSync(pathname, 'utf8');
            if (!html.includes('"@type":"VideoObject"') || !html.includes('<video')) throw new Error('Video watch page is missing VideoObject schema or a crawlable HTML video: ' + url);
            for (const tag of ['<video:thumbnail_loc>', '<video:title>', '<video:description>', '<video:content_loc>']) {
              if (!videoBlocks[i].includes(tag)) throw new Error('Video sitemap entry missing ' + tag + ' for ' + url);
            }
            const thumbnail = (videoBlocks[i].match(/<video:thumbnail_loc>(.*?)<\\/video:thumbnail_loc>/) || [])[1];
            if (!thumbnail) throw new Error('Video sitemap thumbnail URL is missing for ' + url);
            const thumbnailPath = new URL(thumbnail).pathname.replace(/^\\/+/, '');
            if (!fs.existsSync(thumbnailPath)) throw new Error('Generated Reel thumbnail file is missing: ' + thumbnailPath);
          }
          const leadersHtml = fs.readFileSync('leaders.html', 'utf8');
          const schemaRaw = leadersHtml.split('<script type="application/ld+json">')[1]?.split('</script>')[0];
          if (!schemaRaw) throw new Error('Leadership directory JSON-LD is missing');
          const schema = JSON.parse(schemaRaw);
          const cards = [...leadersHtml.matchAll(/<article class="person"/g)].length;
          if (!cards) throw new Error('Leadership directory has no published leader cards');
          if (schema.mainEntity?.numberOfItems !== cards) throw new Error('Leadership card count and JSON-LD count do not match');
          if ((schema.mainEntity?.itemListElement || []).length !== cards) throw new Error('Leadership JSON-LD entries do not match visible cards');
          const profileLinks = [...leadersHtml.matchAll(/href="([^"]+)"/g)].map(m => m[1]).filter(href => href.startsWith('./leaders/auto/') && href.endsWith('.html')).map(href => 'https://www.yuvakesariyouthclub.in/' + href.slice(2));
          if (profileLinks.length !== cards) throw new Error('Each visible leader must link to one generated profile');
          for (const url of profileLinks) {
            if (!urls.includes(url)) throw new Error('Leader profile missing from sitemap: ' + url);
          }
          console.log('Validated sitemap URLs:', urls.length, '| leader profiles:', cards);
          NODE

      - name: Commit generated public pages
        run: |
          git config user.name "YYC Website Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sitemap.xml video-sitemap.xml robots.txt events updates gallery reels swags leaders achievements leaders.html
          if git diff --cached --quiet; then
            echo "No public SEO changes to commit."
            exit 0
          fi
          git commit -m "Sync published YYC content for search engines"
          git pull --rebase origin main
          git push origin HEAD:main
