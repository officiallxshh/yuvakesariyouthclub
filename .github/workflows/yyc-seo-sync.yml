name: YYC Public SEO Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate public pages
        run: node scripts/generate-public-pages.mjs
      - name: Commit generated public pages
        run: |
          git config user.name "YYC Website Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml events updates gallery leaders achievements
          git diff --cached --quiet || git commit -m "Sync YYC public SEO pages"
          git push
