name: YYC Full Stack Temporary Audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.52.0 install chromium
      - name: Run browser + Supabase audit
        env:
          BASE_URL: https://officiallxshh.github.io/yuvakesariyouthclub/
          CUSTOM_URL: https://www.yuvakesariyouthclub.in/
        run: |
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base = process.env.BASE_URL;
          const custom = process.env.CUSTOM_URL;
          const report = { base:{}, custom:{}, supabase:{}, errors:[] };

          async function auditPage(url, label) {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            const consoleErrors=[]; const pageErrors=[]; const failed=[];
            page.on('console', m => { if(m.type()==='error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('requestfailed', r => failed.push({url:r.url(),failure:r.failure()?.errorText||'unknown'}));
            const response = await page.goto(url,{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(3000);

            const state = await page.evaluate(() => {
              const ids=['home','glimpse','leaders','swags','updates','events','gallery','join'];
              const sections={};
              for(const id of ids){
                const e=document.getElementById(id);
                const r=e?.getBoundingClientRect();
                sections[id]={
                  exists:!!e,
                  height:r?.height||0,
                  top:r?.top||0,
                  display:e ? getComputedStyle(e).display : 'missing',
                  visibility:e ? getComputedStyle(e).visibility : 'missing',
                  opacity:e ? getComputedStyle(e).opacity : 'missing'
                };
              }
              return {
                title:document.title,
                publicDataKeys:Object.keys(window.publicData||{}),
                counts:{
                  leaders:document.querySelectorAll('#leadersGrid .leader-card').length,
                  swags:document.querySelectorAll('#swagsGrid .swag-card').length,
                  updates:document.querySelectorAll('#updatesGrid .update-card').length,
                  events:document.querySelectorAll('#eventsGrid .event-card:not(.event-skeleton)').length,
                  gallery:document.querySelectorAll('#galleryGrid .gallery-card').length
                },
                sections,
                bodyScrollHeight:document.body.scrollHeight
              };
            });

            const navResults={};
            for(const id of ['home','glimpse','leaders','swags','updates','events','gallery','join']){
              const ok=await page.evaluate(id=>{
                const a=[...document.querySelectorAll('a[href^="#"]')].find(x=>x.getAttribute('href')==='#'+id);
                if(!a)return false; a.click(); return true;
              },id);
              await page.waitForTimeout(80);
              navResults[id]=await page.evaluate(id=>{
                const e=document.getElementById(id); if(!e)return {ok:false};
                return {ok:true,height:e.getBoundingClientRect().height,scrollY:window.scrollY};
              },id);
            }

            const modalTests={};
            for(const [id,formSel] of [['memberRegisterBtn','#memberRegisterForm'],['memberLoginBtn','#memberLoginForm'],['leaderLoginBtn','#leaderLoginForm'],['adminOpenBtn','#adminLoginForm']]){
              await page.evaluate(id=>document.getElementById(id)?.click(),id);
              await page.waitForTimeout(180);
              modalTests[id]=await page.evaluate(formSel=>{
                const m=document.getElementById('modal');
                return {open:!!m?.classList.contains('open'),form:!!document.querySelector(formSel),text:(document.getElementById('modalContent')?.textContent||'').slice(0,120)};
              },formSel);
              await page.locator('[data-modal-close-only]').click().catch(()=>{});
              await page.waitForTimeout(120);
            }

            report[label]={status:response?.status()||0,state,navResults,modalTests,consoleErrors,pageErrors,failed};
            await browser.close();
          }

          async function rpc(key, name, body={}) {
            const res=await fetch(key.url+'/rest/v1/rpc/'+name,{
              method:'POST',
              headers:{apikey:key.key,Authorization:'Bearer '+key.key,'Content-Type':'application/json'},
              body:JSON.stringify(body)
            });
            const text=await res.text();
            let data; try{data=JSON.parse(text)}catch{data=text}
            return {status:res.status,data};
          }

          const prod=await fetch(base+'yyc-production.js',{redirect:'follow'});
          const js=await prod.text();
          const urlMatch=js.match(/SUPA_URL='([^']+)'/);
          const keyMatch=js.match(/SUPA_KEY='([^']+)'/);
          if(!urlMatch||!keyMatch) throw new Error('Could not discover Supabase client configuration');
          const key={url:urlMatch[1],key:keyMatch[1]};
          report.supabase.siteData=await rpc(key,'public_site_data');
          report.supabase.featureData=await rpc(key,'public_feature_data');
          report.supabase.invalidVerify=await rpc(key,'public_role_verify',{p_role_number:'YYC-TEST-0000'});

          await auditPage(base,'base');
          await auditPage(custom,'custom');

          fs.writeFileSync('yyc-full-audit.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          EOF
          node audit.mjs
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: yyc-full-audit
          path: yyc-full-audit.json
