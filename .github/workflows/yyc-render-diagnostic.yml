name: YYC Temporary Render Diagnostic
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.52.0 install chromium
      - name: Capture live GitHub Pages render
        run: |
          npx --yes playwright@1.52.0 screenshot --device="Desktop Chrome" --full-page "https://officiallxshh.github.io/yuvakesariyouthclub/?renderdebug=20260930b" github-pages.png
      - name: Capture custom domain render
        run: |
          npx --yes playwright@1.52.0 screenshot --device="Desktop Chrome" --full-page "https://www.yuvakesariyouthclub.in/?renderdebug=20260930b" custom-domain.png
      - name: Upload renders
        uses: actions/upload-artifact@v4
        with:
          name: yyc-render-diagnostic
          path: |
            github-pages.png
            custom-domain.png
