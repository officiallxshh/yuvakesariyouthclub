name: YYC Preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yyc-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: TypeScript type check
        run: npx --yes -p typescript@5.9.3 tsc --noEmit -p tsconfig.json

      - name: Node.js ID-card orchestrator check
        run: npm run node:check-id-card

      - name: Setup Deno for Edge Function type check
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check YYC certificate Edge Function
        run: deno check --config supabase/functions/yyc-certificate-delivery/deno.json supabase/functions/yyc-certificate-delivery/index.ts

      - name: Type-check YYC image upload Edge Function
        run: deno check supabase/functions/yyc-image-upload/index.ts

      - name: Syntax checks
        run: |
          node --check app.js
          node --check yyc90.js
          node --check yyc90-final.js
          node --check yyc-production.js
          node --check access.js
          node --check scripts/generate-public-pages.mjs
          node --check scripts/backup-supabase.mjs
          node --check scripts/validate-backup.mjs
          node --check scripts/yyc-browser-regression.mjs
          node --check scripts/yyc-task-workflow.test.mjs
          node --check scripts/yyc-certificate-workflow.test.mjs
          node --check scripts/yyc-cinematic-motion.test.mjs
          node --check scripts/yyc-performance-stability.test.mjs
          node --check scripts/yyc-achievement-showcase.test.mjs
          node --check scripts/yyc-performance-browser-regression.mjs
          node --check scripts/production-monitor.mjs

      - name: Volunteer task workflow checks
        run: npm run test:task-workflow

      - name: Certificate issuance and delivery checks
        run: npm run test:certificate-workflow

      - name: Cinematic motion and accessibility checks
        run: npm run test:cinematic-motion

      - name: Achievement podium and photo grouping checks
        run: npm run test:achievements

      - name: Performance stability checks
        run: npm run test:performance-stability

      - name: Full repository audit
        run: node scripts/yyc-full-audit.mjs

      - name: Public site smoke test
        run: node scripts/smoke-http.mjs

# preflight asset sync
