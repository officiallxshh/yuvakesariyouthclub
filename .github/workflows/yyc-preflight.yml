name: YYC Preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yyc-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax checks
        run: |
          node --check app.js
          node --check yyc90.js
          node --check yyc90-final.js
          node --check yyc-production.js
          node --check scripts/generate-public-pages.mjs
          node --check scripts/backup-supabase.mjs
          node --check scripts/production-monitor.mjs

      - name: Public site smoke test
        run: node scripts/smoke-http.mjs
