<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YYC Certificate · Verify</title>
<meta name="description" content="Official Yuvakesari Youth Club certificate verification page.">
<style>
:root{color-scheme:dark;--bg:#05080b;--panel:#0b1218;--line:#283238;--gold:#d7b66d;--soft:#89948f;--cream:#eee5d2;--green:#8fd0a7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#19221d 0,#080d10 38%,#05080b 78%);font-family:Inter,Arial,Helvetica,sans-serif;color:var(--cream);display:flex;align-items:center;justify-content:center;padding:28px 16px}
.shell{width:min(1040px,100%);background:rgba(11,18,24,.94);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 35px 90px rgba(0,0,0,.38)}
.head{padding:24px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}.monogram{width:52px;height:52px;border-radius:15px;border:1px solid #786037;display:grid;place-items:center;background:#101a17;color:var(--gold);font-weight:900;letter-spacing:-1px}.brand{font-weight:900;letter-spacing:2px;font-size:12px}.sub{margin-top:5px;color:#72807a;font-size:10px;letter-spacing:1.4px}.pill{margin-left:auto;border:1px solid #315641;color:var(--green);background:#0c1d14;border-radius:999px;padding:8px 12px;font-size:9px;font-weight:900;letter-spacing:1px}
.body{padding:32px 28px}.kicker{color:var(--gold);font-size:10px;font-weight:900;letter-spacing:1.7px}.title{font-size:clamp(28px,4vw,46px);margin:10px 0 8px;line-height:1.05}.muted{color:var(--soft);line-height:1.7;font-size:13px;max-width:760px}
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;margin-top:24px}.card{background:#0d151a;border:1px solid #252f34;border-radius:20px;padding:20px}.label{font-size:9px;letter-spacing:1.5px;font-weight:900;color:#78847f}.value{font-size:20px;font-weight:900;color:#e9ddc4;margin-top:7px}.rows{display:grid;gap:12px;margin-top:16px}.row{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #20292e;padding-top:11px}.row span{font-size:10px;color:#727e79}.row b{text-align:right;font-size:12px;color:#dfd6c5}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{appearance:none;border:1px solid #5a4a2b;background:#d7b66d;color:#080b0d;border-radius:12px;padding:13px 17px;font-weight:900;letter-spacing:1px;font-size:10px;text-decoration:none;cursor:pointer}.btn.secondary{background:#111a20;color:#e7d6ad;border-color:#5a4a2b}
#preview{width:100%;height:min(70vh,720px);border:1px solid #242e33;border-radius:16px;background:#06090c;margin-top:18px}.state{padding:46px 20px;text-align:center;color:var(--soft)}.state strong{display:block;color:var(--cream);font-size:20px;margin-bottom:8px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.pill{display:none}.head{padding:20px}.body{padding:26px 18px}.row{display:grid;grid-template-columns:1fr}.row b{text-align:left}.card{padding:17px}}
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <div class="monogram">YYC</div>
    <div><div class="brand">YUVAKESARI YOUTH CLUB</div><div class="sub">SUBRAHMANYA · KARNATAKA</div></div>
    <div class="pill">OFFICIAL VERIFICATION</div>
  </header>
  <main class="body" id="app">
    <div class="state"><strong>Checking certificate…</strong>Please wait.</div>
  </main>
</div>
<script>
(function(){
  var host=document.getElementById('app');
  var params=new URLSearchParams(location.search);
  var token=params.get('token')||'';
  var endpoint='https://vrllozfzheikjbhxvpk.supabase.co/functions/v1/yyc-certificate-public?token='+encodeURIComponent(token);
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function formatDate(v){if(!v)return 'Date not specified';var d=new Date(String(v).slice(0,10)+'T00:00:00Z');return isNaN(d)?String(v):d.toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric',timeZone:'UTC'});}
  if(!/^[0-9a-f-]{36}$/i.test(token)){host.innerHTML='<div class="state"><strong>Invalid certificate link</strong>The verification token is missing or invalid.</div>';return;}
  fetch(endpoint,{headers:{accept:'application/json'}}).then(function(r){return r.json().then(function(x){if(!r.ok)throw new Error(x.error||'Certificate could not be verified');return x;});})
  .then(function(x){
    var c=x.certificate||{};
    host.innerHTML='<div class="kicker">VERIFIED YYC CERTIFICATE</div>'+
      '<div class="title">'+esc(c.recipient_name)+'</div>'+
      '<div class="muted">This certificate is recorded in the official Yuvakesari Youth Club certificate register.</div>'+
      '<div class="grid">'+
        '<section class="card"><div class="label">CERTIFICATE NUMBER</div><div class="value">'+esc(c.certificate_no_display)+'</div><div class="rows">'+
          '<div class="row"><span>CERTIFICATE ID</span><b>'+esc(c.certificate_code)+'</b></div>'+
          '<div class="row"><span>EVENT</span><b>'+esc(c.event_title)+'</b></div>'+
          '<div class="row"><span>DATE</span><b>'+esc(formatDate(c.event_date))+'</b></div>'+
          '<div class="row"><span>LOCATION</span><b>'+esc(c.location||'YYC')+'</b></div>'+
          '<div class="row"><span>STATUS</span><b style="color:#8fd0a7">VALID · '+esc(String(c.status||'verified').toUpperCase())+'</b></div>'+
        '</div><div class="actions"><a class="btn" href="'+esc(x.download_url)+'" target="_blank" rel="noopener">OPEN / DOWNLOAD PDF ↗</a><a class="btn secondary" href="./">BACK TO YYC</a></div></section>'+
        '<section class="card"><div class="label">CERTIFICATE PREVIEW</div><iframe id="preview" title="Certificate preview"></iframe></section>'+
      '</div>';
    document.getElementById('preview').src=x.download_url;
  })
  .catch(function(err){host.innerHTML='<div class="state"><strong>Certificate not available</strong>'+esc(err.message||'The certificate could not be verified right now.')+'</div>';});
})();
</script>
</body>
</html>
